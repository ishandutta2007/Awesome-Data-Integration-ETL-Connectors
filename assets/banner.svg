<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420" style="background: #090d16; border-radius: 14px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0c1222"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #1e293b; stroke-opacity: 0.35; stroke-width: 1; }
    .stream-line { fill: none; stroke-width: 2.5; stroke-dasharray: 8, 12; animation: flow 20s linear infinite; }
    .stream-line-fast { fill: none; stroke-width: 2; stroke-dasharray: 6, 10; animation: flowFast 12s linear infinite; }
    .pulse-circle { animation: pulse 3s ease-in-out infinite alternate; }
    .pulse-circle-delayed { animation: pulse 3.5s ease-in-out infinite alternate 1.5s; }
    .float-node { animation: floatSlow 6s ease-in-out infinite alternate; }
    .float-node-2 { animation: floatSlow 7s ease-in-out infinite alternate 1s; }
    .tag-pill { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 14; }
    .tag-text { font-size: 13px; font-weight: 600; fill: #94a3b8; }
    
    @keyframes flow {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes flowFast {
      0% { stroke-dashoffset: 320; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulse {
      0% { transform: scale(0.96); opacity: 0.4; }
      100% { transform: scale(1.08); opacity: 0.85; }
    }
    @keyframes floatSlow {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Subtle Glowing Orbs in Background -->
  <circle cx="150" cy="100" r="140" fill="#0284c7" opacity="0.15" filter="url(#softGlow)"/>
  <circle cx="1050" cy="300" r="160" fill="#8b5cf6" opacity="0.18" filter="url(#softGlow)"/>
  <circle cx="600" cy="380" r="180" fill="#06b6d4" opacity="0.1" filter="url(#softGlow)"/>

  <!-- Background Grid Pattern -->
  <g class="grid-line">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="120" y1="0" x2="120" y2="420"/>
    <line x1="240" y1="0" x2="240" y2="420"/>
    <line x1="360" y1="0" x2="360" y2="420"/>
    <line x1="480" y1="0" x2="480" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="720" y1="0" x2="720" y2="420"/>
    <line x1="840" y1="0" x2="840" y2="420"/>
    <line x1="960" y1="0" x2="960" y2="420"/>
    <line x1="1080" y1="0" x2="1080" y2="420"/>
  </g>

  <!-- Animated Data Pipeline Connectors (Background Flows) -->
  <path d="M 60,330 C 260,330 320,380 520,380 C 720,380 780,330 1140,330" 
        stroke="url(#streamGrad1)" class="stream-line" filter="url(#glow)"/>
  
  <path d="M 60,360 C 240,360 380,310 600,310 C 820,310 960,360 1140,360" 
        stroke="url(#streamGrad2)" class="stream-line-fast" filter="url(#glow)"/>

  <!-- Left Source Node Icon Group (Float animation) -->
  <g class="float-node" transform="translate(60, 290)">
    <rect width="80" height="70" rx="12" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
    <circle cx="40" cy="28" r="14" fill="#0284c7" opacity="0.3"/>
    <path d="M 33,28 L 47,28 M 40,21 L 40,35" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <text x="40" y="54" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">SOURCES</text>
  </g>

  <!-- Middle CDC & Transform Hub Group -->
  <g class="float-node-2" transform="translate(560, 275)">
    <rect width="90" height="75" rx="14" fill="url(#nodeGrad)" stroke="#818cf8" stroke-width="1.5" opacity="0.95"/>
    <circle cx="45" cy="30" r="15" fill="#6366f1" opacity="0.3"/>
    <polygon points="40,24 53,30 40,36" fill="#a855f7"/>
    <text x="45" y="57" font-size="11" font-weight="700" fill="#cbd5e1" text-anchor="middle">ETL / CDC</text>
  </g>

  <!-- Right Target Warehouse Node Group -->
  <g class="float-node" transform="translate(1060, 290)">
    <rect width="80" height="70" rx="12" fill="url(#nodeGrad)" stroke="#c084fc" stroke-width="1.5" opacity="0.9"/>
    <circle cx="40" cy="28" r="14" fill="#a855f7" opacity="0.3"/>
    <ellipse cx="40" cy="24" rx="12" ry="5" fill="none" stroke="#c084fc" stroke-width="1.5"/>
    <path d="M 28,24 v 8 c 0,3 5.4,5 12,5 s 12,-2 12,-5 v -8" fill="none" stroke="#c084fc" stroke-width="1.5"/>
    <text x="40" y="54" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">LAKES / DW</text>
  </g>

  <!-- FOREGROUND TEXT & BRANDING (Crisp, High Contrast, Guaranteed Foreground) -->
  <g id="foreground-content">
    <!-- Category Mini-Badge -->
    <g transform="translate(60, 52)">
      <rect width="210" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.95"/>
      <circle cx="16" cy="15" r="5" fill="#38bdf8"/>
      <text x="32" y="20" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">DATA INTEGRATION</text>
    </g>

    <!-- Main Title -->
    <text x="60" y="132" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
      Awesome ETL &amp; Data Integration Connectors
    </text>

    <!-- Subtitle -->
    <text x="60" y="174" font-size="20" font-weight="400" fill="#e2e8f0" opacity="0.95">
      Curated Landscape of Managed ELT, Real-Time CDC Pipelines &amp; Open-Source Connectors
    </text>

    <!-- Tagline & Highlights -->
    <text x="60" y="206" font-size="14" font-weight="500" fill="#94a3b8">
      Fivetran · Airbyte · Debezium · Apache NiFi · dbt · SeaTunnel · Confluent · dlt · Meltano
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(60, 230)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="135" height="28" class="tag-pill"/>
      <text x="67" y="18" class="tag-text" text-anchor="middle">⚡ Real-Time CDC</text>

      <!-- Pill 2 -->
      <rect x="145" y="0" width="150" height="28" class="tag-pill"/>
      <text x="220" y="18" class="tag-text" text-anchor="middle">🔄 Zero-Code ELT</text>

      <!-- Pill 3 -->
      <rect x="305" y="0" width="165" height="28" class="tag-pill"/>
      <text x="387" y="18" class="tag-text" text-anchor="middle">🌐 700+ Connectors</text>

      <!-- Pill 4 -->
      <rect x="480" y="0" width="175" height="28" class="tag-pill"/>
      <text x="567" y="18" class="tag-text" text-anchor="middle">🛠️ Open-Source Stack</text>

      <!-- Pill 5 -->
      <rect x="665" y="0" width="155" height="28" class="tag-pill"/>
      <text x="742" y="18" class="tag-text" text-anchor="middle">📊 Lakehouse Sync</text>
    </g>
  </g>
</svg>
